cyllene_digital_sylius_ai_translation:
    ui:
        generation_invalid_locales: "Pick two different locales for the generation."
        generation_unknown_scope: "Unknown channel — reload the page and pick the channel again."
        generation_unknown_locale: "Unknown locale — the source and target must be locales the host exposes (the selected channel's, when one is browsed)."
        generation_unknown_catalogue: "Unknown catalogue — its files no longer exist, reload the page."
        generation_unknown_provider: "Unknown provider — it is not declared in the configuration, reload the page."
        generation_queued: "{count, plural, one {Generation queued (1 catalogue)} other {Generation queued (# catalogues)}} — refresh the page to watch the suggestions arrive. If nothing arrives within a few minutes, the generation worker is probably stopped: ask your administrator."
        suggestion_value_required: "This suggestion has no value (failed generation, or still with the provider) — type the translation in the review modal, or wait for the reply or relaunch with \"Retry errors\"."
        bulk_approve_skipped_keys: "{count, plural, one {# suggestion was} other {# suggestions were}} skipped — missing value (failed generation, or still with the provider), placeholders differing from the source, syntax not matching the catalogue, or reviewed by someone else in the meantime: {keys} — review them individually."
        import_file_rejected: "File rejected — check the format (xlf or csv) and the size ({max, number} MB max)."
        import_upload_interrupted: "The file did not reach the server whole — try again."
        import_upload_server_error: "The server could not store the file — it is not the file's fault: ask your administrator."
        export_nothing: "Nothing to export — no row matches the filters."
        import_file_missing: "Select a file to import."
        import_invalid_file: "The file could not be parsed — export first to get a valid template."
        import_staging_failed: "The file is valid but could not be kept for its confirmation — the cache refused it (too large for it, or unavailable). Ask your administrator."
        import_success: "{imported, plural, =0 {No override imported} one {# override imported} other {# overrides imported}}{skipped, plural, =0 {} one { (# invalid entry skipped)} other { (# invalid entries skipped)}}{unchanged, plural, =0 {} one { (# value already up to date or empty, ignored)} other { (# values already up to date or empty, ignored)}}{reverted, plural, =0 {} one { (# override removed, back to the value the entry inherits or its file value)} other { (# overrides removed, back to the value each entry inherits or its file value)}}."
        import_cancelled: "Import cancelled — nothing was written."
        import_empty: "Nothing to import — every value is already up to date, empty or invalid."
        import_preview_expired: "The staged import has expired — upload the file again."
        import_skipped_entries: "Skipped entries — fix them in the file and import it again: {entries}"
        purge_orphans_done: "{count, plural, =0 {No orphan override to delete.} one {# orphan override deleted.} other {# orphan overrides deleted.}}"
        import_unsupported_format: "Unsupported file format — use xlf or csv."
        suggestion_already_reviewed: "This suggestion has already been reviewed."
        suggestion_approved: "{change, select, none {Suggestion approved — it was already the value shown, no override written.} revert {Suggestion approved — it is the value the entry shows without an override, so the override was removed.} other {Suggestion approved and translation applied.}}"
        bulk_approved: "{count, plural, =0 {No suggestion approved.} one {# suggestion approved — translation applied.} other {# suggestions approved — translations applied.}}{unchanged, plural, =0 {} one { # of them was already the value shown: no override written.} other { # of them were already the value shown: no override written.}}{reverted, plural, =0 {} one { # of them was the value shown without an override: override removed.} other { # of them were the value shown without an override: overrides removed.}}"
        bulk_rejected: "{count, plural, =0 {No suggestion rejected} one {# suggestion rejected and deleted} other {# suggestions rejected and deleted}}."
        suggestion_rejected: "Suggestion rejected and deleted."
        suggestion_placeholder_mismatch: "Approval refused — the placeholders differ from the source ({placeholders}). Open the review to fix the value, or reject the suggestion."
        translation_saved: "Translation saved — visible immediately."
        translation_unchanged: "Nothing saved — the entry already shows this value."
        translation_reverted: "{baseline, select, file {Same as the file value} other {Same as the value the entry inherits}} — the override is deleted instead of storing a copy."
        translation_saved_suggestions_closed: "{count, plural, one {# pending AI suggestion for this key was closed} other {# pending AI suggestions for this key were closed}}: the value you chose replaces them."
        translation_save_syntax: "Save refused — {issues}."
        translation_saved_placeholder_warning: "Translation saved — careful, placeholders changed compared to the previous value: {placeholders}."
        suggestion_syntax_invalid: "Approval refused — {issues}."
        translation_reset: "Override deleted — the entry shows the value it inherits, or its file value, again."
        translation_reset_nothing: "Nothing to delete — this entry has no override any more."
        translation_cleared: "Override deleted — the entry has no translation left."
        translation_save_invalid: "Save refused — this entry cannot be saved (unknown locale or channel, or an identifier too long), reload the page."
        translation_key_too_long: "Save refused — this key is longer than the {max} characters an override can store."
        translation_catalogue_unknown: "Save refused — this catalogue no longer exists in the files, reload the page."
        translation_empty_ignored: "Nothing to save — the value is empty and the key has no translation."
        translation_empty_refused: "Save refused — an empty value is not stored. To go back to the original text, use \"Remove the override\"."
