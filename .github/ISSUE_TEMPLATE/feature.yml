name: Suggest an improvement
description: A feature or an enhancement
labels: ["enhancement"]
body:
    - type: textarea
      id: problem
      attributes:
          label: The need
          description: "What concrete problem are you running into? Describe the situation, not the solution."
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: What you suggest
    - type: dropdown
      id: scope
      attributes:
          label: This concerns
          options:
              - The translation management screen
              - Import / export
              - The AI suggestions screen and the review workflow
              - Channel scopes
              - The documentation
              - Something else
      validations:
          required: true
    - type: markdown
      attributes:
          value: |
              A request about the engine itself - a new AI provider, the override storage, the
              console commands - belongs to
              [cyllene-digital/ai-translation-bundle](https://github.com/CylleneDigital/AiTranslationBundle/issues).
